# Flaming Yak - LXD Container Configuration
# This file documents the LXD container setup for u01

# ============================================================================
# HOST CONFIGURATION
# ============================================================================
# LXD initialization:
#   lxd init
#
# Storage pool: default (dir type)
# Network: lxdbr0 (NAT bridge) and enp4s0 (physical)

# ============================================================================
# FRONTEND CONTAINER (Caddy Web Server)
# ============================================================================
#
# Create:
#   lxc launch ubuntu:24.04 frontend --config limits.cpu=1 --config limits.memory=512MiB
#
# Configuration:
#   - Name: frontend
#   - OS: Ubuntu 24.04
#   - CPU: 1 vCPU
#   - RAM: 512 MiB
#   - Storage: Default pool
#   - Network: lxdbr0 (10.241.30.242)
#
# Proxy devices (port forwarding):
#   lxc config device add frontend http proxy listen=tcp:0.0.0.0:80 connect=tcp:127.0.0.1:80
#   lxc config device add frontend https proxy listen=tcp:0.0.0.0:443 connect=tcp:127.0.0.1:443
#
# Software:
#   - Caddy 2.11.9 (installed via Cloudsmith repository)
#   - Configuration: /etc/caddy/Caddyfile
#   - Web root: /var/www/html
#   - Service: caddy.service (systemd)
#
# Commands:
#   - Start: lxc start frontend
#   - Stop: lxc stop frontend
#   - Restart Caddy: lxc exec frontend -- systemctl restart caddy
#   - View logs: lxc exec frontend -- journalctl -u caddy -f

# ============================================================================
# DDNS CONTAINER (Porkbun DNS Updater)
# ============================================================================
#
# Create:
#   lxc launch ubuntu:24.04 ddns --config limits.cpu=1 --config limits.memory=256MiB
#
# Configuration:
#   - Name: ddns
#   - OS: Ubuntu 24.04
#   - CPU: 1 vCPU
#   - RAM: 256 MiB
#   - Storage: Default pool
#   - Network: lxdbr0 (10.241.30.113)
#
# Software:
#   - curl
#   - jq
#   - cron
#   - Script: /opt/update-dns.sh
#
# Cron job (runs every 5 minutes):
#   */5 * * * * root /opt/update-dns.sh >> /var/log/ddns.log 2>&1
#
# Commands:
#   - Start: lxc start ddns
#   - Stop: lxc stop ddns
#   - Run update: lxc exec ddns -- /opt/update-dns.sh
#   - View logs: lxc exec ddns -- cat /var/log/ddns.log

# ============================================================================
# HOST SECURITY CONFIGURATION
# ============================================================================
#
# UFW Firewall:
#   sudo ufw default deny incoming
#   sudo ufw default allow outgoing
#   sudo ufw allow ssh
#   sudo ufw allow 80/tcp
#   sudo ufw allow 443/tcp
#   sudo ufw enable
#
# fail2ban:
#   sudo apt install -y fail2ban
#   sudo systemctl enable fail2ban
#   sudo systemctl start fail2ban
#
# Router Configuration:
#   - Port forward: 80 (TCP) -> 192.168.0.16:80
#   - Port forward: 443 (TCP) -> 192.168.0.16:443
#   - DMZ: 192.168.0.16 (already configured)
